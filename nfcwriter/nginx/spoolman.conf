# One origin for Spoolman and the tag writer.
#
# This is not a convenience. Addressing the writer directly as
# http://<host>:7914 from a page served on another port does not work: browsers
# refuse to send the request at all --
#
#     net::ERR_BLOCKED_BY_CLIENT
#
# -- which is not CORS (that was configured correctly and verified) but
# ad-block and privacy lists, private-network-access hardening and enterprise
# policy, all of which match a bare IP:port called from a web page. Measured
# side by side in one page load: :7914/status blocked, /nfcwriter/status 200.
# No server-side setting can fix the first, because the request never leaves
# the browser. Serving both under one origin removes the cross-origin call.

server {
    listen 7900;
    listen [::]:7900;
    server_name _;

    # Spoolman streams tag scans and live inventory updates over WebSockets, and
    # the writer streams reader status over SSE. Both are long-lived and neither
    # survives the defaults, so the settings below are load-bearing.
    proxy_http_version 1.1;

    # $http_host, not $host: $host drops the port, and the port is part of the
    # origin. Spoolman refuses a websocket handshake whose Origin does not match
    # its own host, so a Host of "192.168.0.165" against an Origin of
    # "http://192.168.0.165:7900" is rejected with a 403 and live sync silently
    # never connects. Spoolman also reads X-Forwarded-Host for exactly this case
    # -- its security module says so -- so both are sent.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade. $connection_upgrade is defined in conf.d/upgrade.conf,
    # because a plain "Connection: upgrade" breaks ordinary requests.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # An idle reader or a quiet inventory must not have its stream closed. The
    # writer sends an SSE keepalive every 20s, so this only has to outlast that
    # comfortably; a WebSocket may genuinely sit silent for much longer.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # The tag writer. The trailing slash on proxy_pass is what strips the
    # /nfcwriter prefix, so the service sees /status rather than
    # /nfcwriter/status and needs no path configuration of its own.
    location /nfcwriter/ {
        proxy_pass http://127.0.0.1:7914/;

        # Buffering would hold an SSE frame until the buffer filled, which for a
        # status stream means never. Without this the reader indicator silently
        # stops updating and nothing reports an error.
        proxy_buffering off;
        proxy_cache off;
    }

    # Without a trailing slash the location above does not match, so the bare
    # path is sent on to /status rather than 404ing confusingly.
    location = /nfcwriter {
        return 301 /nfcwriter/status;
    }

    # Everything else is Spoolman, including its own /api and WebSockets.
    location / {
        proxy_pass http://127.0.0.1:7912;
        proxy_buffering off;
    }
}
