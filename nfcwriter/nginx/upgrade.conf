# Map the Upgrade header to the right Connection value.
#
# Setting "Connection: upgrade" unconditionally breaks every ordinary request;
# this sends "upgrade" only when the client actually asked for one, and "close"
# otherwise. It lives in conf.d because a map directive belongs in the http
# block, not inside a server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
